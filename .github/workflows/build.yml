name: Build STL and images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openscad xvfb xauth imagemagick

      - name: Render STL
        run: |
          mkdir -p dist
          for f in *.scad; do
            openscad -o "dist/${f%.scad}.stl" "$f"
          done
          ls -l dist

      - name: Upload STL artifact
        uses: actions/upload-artifact@v4
        with:
          name: stl
          path: dist/*.stl

      - name: Render images
        run: scripts/render-images.sh

      - name: Upload images artifact
        uses: actions/upload-artifact@v4
        with:
          name: images
          path: images/*.png

      - name: Attach STL and images to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.stl images/*.png \
            --title "$GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" dist/*.stl images/*.png --clobber
